# The Auto-Pigeon fork's ONE build, test, acceptance and release path.
#
#   push to main        build and smoke-check every target natively, then publish a development prerelease
#   pull_request        the same validation with a read-only token; never publishes
#   workflow_dispatch   validation; publishes only when publish=true AND the ref is main
#
# The plan job freezes the commit, version, tag and version banner once; every other job reads it.
# Only the publish job has contents: write. It consumes the archives the accept jobs approved and
# never compiles. The tag it creates does not start this workflow again (push is limited to branches).
#
# Required targets and optional candidates are two chains on purpose, so that nothing optional is an
# ancestor of a required acceptance:
#
#   plan -> build           -> accept            (linux, windows)  -+
#   plan -> build-candidate -> accept-candidate  (macOS)            -+-> publish
#   plan -> source                                                  -+
#
# A matrix has one aggregate result, and continue-on-error forgives a job that ran and failed, not one
# that was cancelled: a macOS job GitHub could not give a runner (run 41418779022) has no step to forgive,
# so in one shared matrix it stopped acceptance and publication for every target.
# Heavy suites, ASan and source-archive rebuild qualification run locally before agent wrap-up.
# All logic is in ci/auto-pigeon/*.py so that every step can be run the same way on a workstation.

name: Auto-Pigeon release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a development prerelease (main only, same gates)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # one run per ref; a newer pull-request push replaces the older run, a run on main is never cancelled mid-upload
  group: auto-pigeon-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      stamp: ${{ steps.plan.outputs.stamp }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version is the commit count
          fetch-tags: true
          persist-credentials: false
      - name: Freeze the plan
        id: plan
        env:
          WANT_PUBLISH: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
        run: |
          python3 ci/auto-pigeon/selftest.py
          python3 ci/auto-pigeon/plan.py --sha "$(git rev-parse HEAD)" --out plan.json --publish "$WANT_PUBLISH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plan
          path: plan.json
          if-no-files-found: error

  build:
    name: Build and smoke (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, runner: ubuntu-22.04, python: python3 }
          - { platform: windows-amd64, runner: windows-2022, python: python }
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - name: Fetch the pinned dependencies
        run: ${{ matrix.python }} ci/auto-pigeon/fetch_deps.py --platform ${{ matrix.platform }} --dest "${{ runner.temp }}/deps" --jobs 3
      - name: Build and run the bounded smoke test
        run: ${{ matrix.python }} ci/auto-pigeon/build.py --platform ${{ matrix.platform }} --deps "${{ runner.temp }}/deps" --build-dir "${{ runner.temp }}/build" --plan "${{ runner.temp }}/plan/plan.json" --report "${{ runner.temp }}/build-report.json" --test-mode smoke --jobs 3
      - name: Package the candidate archive
        run: ${{ matrix.python }} ci/auto-pigeon/package.py --platform ${{ matrix.platform }} --deps "${{ runner.temp }}/deps" --build-report "${{ runner.temp }}/build-report.json" --plan "${{ runner.temp }}/plan/plan.json" --out "${{ runner.temp }}/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/dist/*.zip
            ${{ runner.temp }}/dist/*.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  build-candidate:
    name: Build and smoke (${{ matrix.platform }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # a macOS candidate that fails stays unpublished and is named in the release notes
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-amd64, runner: macos-15-intel, python: python3 }
          - { platform: macos-arm64, runner: macos-15, python: python3 }
    steps: *build-steps

  source:
    name: Source archive
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          submodules: recursive
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - name: Write the source archive
        run: python3 ci/auto-pigeon/source_archive.py --plan "${{ runner.temp }}/plan/plan.json" --out "${{ runner.temp }}/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source
          path: |
            ${{ runner.temp }}/dist/*-source.tar.gz
            ${{ runner.temp }}/dist/*.source.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  accept:
    name: Smoke-check the extracted archive (${{ matrix.platform }})
    needs: [plan, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, runner: ubuntu-22.04, python: python3 }
          - { platform: windows-amd64, runner: windows-2022, python: python }
    steps: &accept-steps
      # a fresh runner: no build tree, no dependency directory, no submodules; only the scripts and the fixtures
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.platform }}
          path: ${{ runner.temp }}/candidate
      - name: Accept
        run: ${{ matrix.python }} ci/auto-pigeon/accept.py --platform ${{ matrix.platform }} --archive "${{ runner.temp }}/candidate/auto-pigeon-ericw-tools-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.zip" --package-json "${{ runner.temp }}/candidate/auto-pigeon-ericw-tools-${{ needs.plan.outputs.version }}-${{ matrix.platform }}.package.json" --plan "${{ runner.temp }}/plan/plan.json" --work "${{ runner.temp }}/acceptance work" --report "${{ runner.temp }}/report/acceptance-${{ matrix.platform }}.json" --smoke
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/report/acceptance-${{ matrix.platform }}.json
            ${{ runner.temp }}/acceptance work/logs/*.log
          if-no-files-found: warn
          retention-days: 14

  accept-candidate:
    name: Smoke-check the extracted archive (${{ matrix.platform }})
    # One candidate's build may have failed or been cancelled and the other's not, so this cannot use the default
    # condition. A matrix entry cannot be dropped by `if`: an entry whose archive never reached the run fails at
    # its download, stays unaccepted and produces no report, and publish.py names it. !cancelled(), never always():
    # cancelling the workflow still stops this.
    needs: [plan, build-candidate]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-amd64, runner: macos-15-intel, python: python3 }
          - { platform: macos-arm64, runner: macos-15, python: python3 }
    steps: *accept-steps

  publish:
    name: Publish the development prerelease
    # Waits for the candidates so that it can read their reports, and has to state its own gates because a cancelled
    # candidate would fail the default condition. Each one compares with 'success', so a required target or source
    # archive that failed, was cancelled or was skipped blocks this job. publish.py then asks the same of the bytes,
    # and leaves out any candidate without a passing report. !cancelled(), never always(): a cancelled workflow publishes nothing.
    needs: [plan, source, accept, accept-candidate]
    if: ${{ !cancelled() && needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.source.result == 'success' && needs.accept.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/auto-pigeon/publish.py --plan "${{ runner.temp }}/artifacts/plan/plan.json" --artifacts "${{ runner.temp }}/artifacts" --repo "${{ github.repository }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --out "${{ runner.temp }}/release"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-record
          path: |
            ${{ runner.temp }}/release/*.json
            ${{ runner.temp }}/release/*.md
            ${{ runner.temp }}/release/SHA256SUMS
          if-no-files-found: warn

